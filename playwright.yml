name: Playwright Tests — ING Cookie Consent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: "Test on ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false         # Inne przeglądarki testują dalej, nawet gdy jedna zawiedzie
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instalujemy tylko przeglądarkę z aktualnej gałęzi matrixa
          playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests (${{ matrix.browser }})
        # -p no:xdist wyłącza równoległość, która gryzie się z matrixem
        # --browser wymusza użycie konkretnego silnika
        run: |
          pytest main.py \
            --browser ${{ matrix.browser }} \
            -p no:xdist \
            --tb=short \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.browser }}
          path: |
            test-results/
            .pytest_cache/